name: publish-image
# Publishes the combined app image (webapi + prebuilt webui SPA) to GHCR. Auth uses
# the built-in GITHUB_TOKEN — no committed secrets. See ADR 0012.
#
# Two moving tags, with deliberately different meanings:
#   :latest — the newest RELEASE (pushed only by a vMAJOR.MINOR.PATCH tag)
#   :main   — the tip of main, rebuilt on every merge
#
# Both exist because they answer different questions. `latest` must stay pinned to a
# release, or `install` would hand users untested code. But without `main`, there was
# no container image of the current code at all: after 0.0.1 the app image sat at
# schema v5 while main moved to v7, so an install could only get an image well behind
# the CLI driving it. Lockstep versioning (ADR 0023) means the two have to move
# together, and that needs an image that tracks main.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # GHCR requires a lowercase path; derive it from <owner>/<repo>.
          REPO="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-app"
          case "${{ github.ref }}" in
            refs/tags/v*)
              # A release: pin the version and move `latest` onto it.
              VERSION="${{ github.ref_name }}"
              TAGS="$REPO:$VERSION $REPO:latest $REPO:$SHA"
              ;;
            refs/heads/main)
              # The tip of main. Versioned as "<last release>+<sha>" so anything
              # running it reports a version that can't be mistaken for a release.
              VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)+$SHA"
              TAGS="$REPO:main $REPO:$SHA"
              ;;
            *)
              VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)+$SHA"
              TAGS="$REPO:$SHA"
              ;;
          esac
          echo "list=$TAGS" >> "$GITHUB_OUTPUT"
          echo "scan=$REPO:$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          set -euo pipefail
          TAG_ARGS=""
          for t in ${{ steps.tags.outputs.list }}; do TAG_ARGS="$TAG_ARGS -t $t"; done
          docker build $TAG_ARGS --build-arg CT_VERSION="${{ steps.tags.outputs.version }}" .

      - name: Install grype + trivy
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan with grype (fail on HIGH+)
        run: grype "${{ steps.tags.outputs.scan }}" --fail-on high --only-fixed

      - name: Scan with trivy (fail on HIGH/CRITICAL)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${{ steps.tags.outputs.scan }}"

      - name: Push image
        run: |
          set -euo pipefail
          for t in ${{ steps.tags.outputs.list }}; do docker push "$t"; done
