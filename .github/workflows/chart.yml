name: chart
# The Helm chart (deploy/helm/claude-transcripts, generated by gen:helm; ci.yml checks it
# is up to date). Lint and render it, then install it on a kind cluster and run
# scripts/smoke-helm.ts: provisioning mints the S3 key, the app writes through it, and an
# upgrade keeps every secret. Publishing happens on release, in publish-image.yml.
#
# The app image is built from this commit and loaded into kind, so the chart is tested
# with the code it ships with, not the last release's.
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/helm/**
      - deploy/garage.toml
      - Dockerfile
      - packages/**
      - config/**
      - scripts/smoke-helm.ts
      - .github/workflows/chart.yml
  push:
    branches: [main]
    paths:
      - deploy/helm/**
      - packages/shared/src/blueprint/**
      - .github/workflows/chart.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: azure/setup-helm@v4

      - name: Lint and render
        run: |
          set -euo pipefail
          helm lint deploy/helm/claude-transcripts
          helm template ct deploy/helm/claude-transcripts > /dev/null
          # The non-default shapes render too: a managed Secret, an Ingress, the
          # optional services off.
          helm template ct deploy/helm/claude-transcripts \
            --set existingSecret=mine --set ingress.enabled=true --set ingress.host=ct.example \
            --set garage.enabled=false --set meilisearch.enabled=false > /dev/null

      - uses: helm/kind-action@v1
        with:
          cluster_name: ct

      - name: Build the app image and load it into kind
        run: |
          docker build -t claude-transcripts-app:ci .
          kind load docker-image claude-transcripts-app:ci --name ct

      - name: Install, upgrade, check
        run: bun run scripts/smoke-helm.ts --set images.app=claude-transcripts-app:ci
