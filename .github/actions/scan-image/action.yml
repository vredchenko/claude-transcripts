name: scan-image
description: >
  The project's image scan gate, the same for every image it publishes: grype and
  trivy, failing on HIGH or CRITICAL findings that have a fix. Takes a local image (in
  the runner's Docker) or, with `registry: true`, one pulled straight from its registry.
inputs:
  image:
    description: Image reference to scan.
    required: true
  registry:
    description: Scan the reference from its registry rather than the local Docker daemon.
    default: "false"
runs:
  using: composite
  steps:
    # The scanners run as their official images, pinned by digest in
    # scanners.Dockerfile (#302 item 2). They used to be installed by piping each
    # project's install script from its `main` branch into sh: unpinned third-party
    # code with registry credentials in scope, which also failed whenever GitHub's
    # release redirect returned a 504.
    - name: Resolve the pinned scanner images
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        pins="${{ github.action_path }}/scanners.Dockerfile"
        pin() { awk -v stage="$1" '$1 == "FROM" && $NF == stage { print $2 }' "$pins"; }
        grype="$(pin grype)"; trivy="$(pin trivy)"
        [ -n "$grype" ] && [ -n "$trivy" ] || { echo "::error::no scanner pins in $pins"; exit 1; }
        echo "grype=$grype" >> "$GITHUB_OUTPUT"
        echo "trivy=$trivy" >> "$GITHUB_OUTPUT"
        # Registry credentials (from docker/login-action) are mounted read-only, so a
        # registry scan of a private image works and nothing else of the runner's is.
        echo "docker_config=${DOCKER_CONFIG:-$HOME/.docker}" >> "$GITHUB_OUTPUT"

    - name: Scan with grype (fail on HIGH+)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        SCANNER: ${{ steps.pins.outputs.grype }}
        CONFIG: ${{ steps.pins.outputs.docker_config }}
      run: |
        set -euo pipefail
        src="docker:$IMAGE"; [ "$REGISTRY" = true ] && src="registry:$IMAGE"
        mkdir -p "$CONFIG"
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$CONFIG:/docker-config:ro" -e DOCKER_CONFIG=/docker-config \
          "$SCANNER" "$src" --fail-on high --only-fixed

    - name: Scan with trivy (fail on HIGH/CRITICAL)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        SCANNER: ${{ steps.pins.outputs.trivy }}
        CONFIG: ${{ steps.pins.outputs.docker_config }}
      run: |
        set -euo pipefail
        src=(--image-src docker); [ "$REGISTRY" = true ] && src=(--image-src remote)
        mkdir -p "$CONFIG"
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$CONFIG:/docker-config:ro" -e DOCKER_CONFIG=/docker-config \
          "$SCANNER" image "${src[@]}" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
