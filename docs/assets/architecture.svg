<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 345" width="858" height="345" role="img" aria-labelledby="ct-title ct-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="ct-title">Claude Transcripts — architecture</title><desc id="ct-desc">Claude Code — Fires a hook event at each session lifecycle point. webui — React SPA. Optional — losing it costs the UI, not the data. cli — User-facing CLI and admin utility. agents — Anything that speaks the OpenAPI contract. hook — Writes each event, the end-of-session summary and the transcript blob directly, so recording never depends on the webapi being up. webapi — Every read goes through it; writes are never proxied. CouchDB — Events, summaries and chunks. Append-only. Garage — S3-compatible object storage — the transcript's sole durable home. Meilisearch — Rebuildable full-text index. Optional — losing it costs search, not history. Claude Code → hook: hooks/scripts/dispatch.ts pipes the payload to `claude-transcripts hook run` and always exits 0. hook → CouchDB: Written directly, not through the gateway, so a webapi outage never loses a session. hook → Garage: The same bypass; transcript bytes live only in S3 (ADR 0014). webui → webapi: HTTP cli → webapi: HTTP agents → webapi: HTTP webapi → CouchDB: reads · /api/couch webapi → Garage: reads · /api/s3 webapi → Meilisearch: search</desc><defs><marker id="ct-arrow-muted" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="var(--ct-muted, #57606a)"/></marker><marker id="ct-arrow-clay" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="var(--ct-clay, #d97757)"/></marker></defs><style>:root{--ct-bg:#f6f8fa;--ct-paper:#ffffff;--ct-ink:#1f2328;--ct-muted:#57606a;--ct-border:rgba(0,0,0,.14);--ct-clay:#d97757;--ct-accentText:#c15f3c}@media(prefers-color-scheme:d