name: release-cli
# On a vMAJOR.MINOR.PATCH tag: cross-compile the CLI to standalone binaries for every
# target in packages/shared/src/blueprint/cli-targets.ts, run each one on its own
# platform through install.sh, and only then attach them to the GitHub Release
# (ADR 0036). A manual dispatch, or a PR that touches the build, does everything but
# publish. There is no npm package (ADR 0033), so this needs no secrets.
# Lockstep-versioned with the app image (ADR 0023); see docs/develop/releasing.md.
#
# The target list and the smoke matrix are generated (`bun run gen:distributions`);
# edit cli-targets.ts, not the marked regions.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release-cli.yml
      - install.sh
      - scripts/smoke-cli-binary.sh
      - packages/shared/src/blueprint/cli-targets.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # The binaries report package.json's version, bundled in (#289). A tag that
      # disagrees with the committed manifests would ship binaries that say otherwise.
      - name: Check the tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run scripts/release.ts "${GITHUB_REF_NAME#v}" --check

      - id: version
        run: echo "version=v$(jq -r .version packages/cli/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          mkdir -p out
          # gen:cli-build-targets:start — generated from cli-targets.ts; do not edit
          targets="bun-linux-x64 bun-linux-x64-baseline bun-linux-x64-musl bun-linux-x64-musl-baseline bun-linux-arm64 bun-linux-arm64-musl bun-darwin-x64 bun-darwin-arm64"
          # gen:cli-build-targets:end
          # --splitting keeps Ink out of the entry chunk; without it piped stdout is
          # truncated (#146). Still one self-contained binary.
          for t in $targets; do
            plat="${t#bun-}"
            bun build --compile --splitting --target="$t" packages/cli/src/cli.tsx \
              --outfile "out/claude-transcripts-$plat"
          done
          (cd out && for f in claude-transcripts-*; do sha256sum "$f" > "$f.sha256"; done)
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: out/*

  # Each binary, on its own platform, installed by install.sh from the build's assets:
  # it must pick the right one where it can detect it, verify it, and the binary must
  # print the stamped version, render help and handle a hook event offline.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # gen:cli-smoke-matrix:start — generated from cli-targets.ts; do not edit
          - asset: linux-x64
            runner: ubuntu-latest
            image: ""
            qemu_cpu: ""
            detected: true
          - asset: linux-x64-baseline
            runner: ubuntu-latest
            image: "ubuntu:24.04"
            qemu_cpu: "Nehalem"
            detected: false
          - asset: linux-x64-musl
            runner: ubuntu-latest
            image: "alpine:3"
            qemu_cpu: ""
            detected: true
          - asset: linux-x64-musl-baseline
            runner: ubuntu-latest
            image: "alpine:3"
            qemu_cpu: "Nehalem"
            detected: false
          - asset: linux-arm64
            runner: ubuntu-24.04-arm
            image: ""
            qemu_cpu: ""
            detected: true
          - asset: linux-arm64-musl
            runner: ubuntu-24.04-arm
            image: "alpine:3"
            qemu_cpu: ""
            detected: true
          # gen:cli-smoke-matrix:end
    runs-on: ${{ matrix.runner }}
    name: smoke (${{ matrix.asset }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: out
      - name: Install and run ${{ matrix.asset }}
        env:
          SMOKE_QEMU_CPU: ${{ matrix.qemu_cpu }}
          SMOKE_DETECTED: ${{ matrix.detected }}
          WANT: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          # In a container through `docker run`, not a job `container:`: JavaScript
          # actions don't run in Alpine on arm64 runners, and this needs none.
          if [ -n "${{ matrix.image }}" ]; then
            docker run --rm -v "$PWD:/w" -w /w -e SMOKE_QEMU_CPU -e SMOKE_DETECTED \
              "${{ matrix.image }}" sh scripts/smoke-cli-binary.sh "${{ matrix.asset }}" out "$WANT"
          else
            sh scripts/smoke-cli-binary.sh "${{ matrix.asset }}" out "$WANT"
          fi

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach binaries to the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: out
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: out/*
