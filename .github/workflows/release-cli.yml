name: release-cli
# On a vMAJOR.MINOR.PATCH tag: cross-compile the CLI to standalone binaries
# (Linux + macOS, x64 + arm64), attach them to the GitHub Release, and publish the
# npm package (@claude-transcripts/cli, a bun-runnable bundle). A manual dispatch
# builds the binaries and uploads them as workflow artifacts only (no publish).
# Lockstep-versioned with the app image (ADR 0023); see docs/develop/releasing.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # attach binaries to the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile

      # The binaries report package.json's version, bundled in (#289). A tag that
      # disagrees with the committed manifests would ship binaries that say otherwise.
      - name: Check the tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run scripts/release.ts "${GITHUB_REF_NAME#v}" --check

      - name: Cross-compile binaries (Linux + macOS)
        run: |
          set -euo pipefail
          mkdir -p out
          # --splitting keeps Ink out of the entry chunk; without it piped stdout is
          # truncated (#146). Still one self-contained binary.
          for t in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            plat="${t#bun-}"
            bun build --compile --splitting --target="$t" packages/cli/src/cli.tsx \
              --outfile "out/claude-transcripts-$plat"
          done
          (cd out && for f in claude-transcripts-*; do sha256sum "$f" > "$f.sha256"; done)
          ls -la out
          # The binary reports the version it was stamped with, not something else.
          want="v$(jq -r .version packages/cli/package.json)"
          got="$(./out/claude-transcripts-linux-x64 --version)"
          if [ "$got" != "$want" ]; then
            echo "::error::compiled CLI reports $got, package.json says $want"
            exit 1
          fi

      # Tag build → publish. Dispatch → upload artifacts only.
      - name: Attach binaries to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*

      - name: Upload binaries as artifacts (dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: cli-binaries
          path: out/*

      - name: Build the npm bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Drop `dependencies` from the manifest we publish (the version is already
          # the release's — the check above made sure):
          # the bundle is self-contained (bun inlines every dependency), and npm can't
          # parse this monorepo's `workspace:` protocol — it fails EUNSUPPORTEDPROTOCOL.
          #
          # Edited with jq rather than `npm version`/`npm pkg`, because those reify the
          # whole workspace and hit that same protocol error on the OTHER packages,
          # which still legitimately declare `workspace:*`. This mutation is CI-local
          # and never committed. node_modules is already installed, so removing the
          # declaration doesn't affect how the bundle resolves imports.
          jq 'del(.dependencies)' \
            packages/cli/package.json > /tmp/cli-package.json
          mv /tmp/cli-package.json packages/cli/package.json
          bun run scripts/build-cli-npm.ts

      # npm is the one artifact needing a secret. Until NPM_TOKEN is configured
      # (docs/develop/releasing.md → one-time setup), skip it with a warning rather
      # than failing the release — the binaries and images publish either way.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not configured; see docs/develop/releasing.md"
            exit 0
          fi
          # From the package directory, not `--workspace`: the latter pulls npm into
          # workspace-wide resolution and the `workspace:` protocol it can't read.
          cd packages/cli && npm publish
