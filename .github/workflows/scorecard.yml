name: scorecard

# OpenSSF Scorecard (#302 item 8): a weekly check of the repo's supply-chain practices
# (pinned dependencies, token permissions, branch protection, code review, signed
# releases, …). Results go to code scanning (Security → Code scanning, tool
# "Scorecard") and to the public Scorecard API, which serves the README badge.
#
# publish_results requires a workflow Scorecard can verify: no write permissions at the
# top level, and only the steps below. Keep it that way, or publishing fails.

on:
  schedule:
    - cron: "29 7 * * 1" # Mondays, 07:29 UTC
  push:
    branches: [main]
    paths:
      - .github/workflows/scorecard.yml
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF report
      id-token: write # sign the results published to the Scorecard API
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
