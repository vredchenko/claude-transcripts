name: publish-image
# Publishes the combined app image (webapi + prebuilt webui SPA) to GHCR. Auth uses
# the built-in GITHUB_TOKEN — no committed secrets. See ADR 0012.
#
# Two moving tags, with deliberately different meanings:
#   :latest — the newest RELEASE (pushed only by a vMAJOR.MINOR.PATCH tag)
#   :main   — the tip of main, rebuilt on every merge
#
# Both exist because they answer different questions. `latest` must stay pinned to a
# release, or `install` would hand users untested code. But without `main`, there was
# no container image of the current code at all: after 0.0.1 the app image sat at
# schema v5 while main moved to v7, so an install could only get an image well behind
# the CLI driving it. Lockstep versioning (ADR 0023) means the two have to move
# together, and that needs an image that tracks main.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # The pushed app image, by commit tag — what the omnibus job assembles from.
      image: ${{ steps.tags.outputs.scan }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # GHCR requires a lowercase path; derive it from <owner>/<repo>.
          REPO="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-app"
          case "${{ github.ref }}" in
            refs/tags/v*)
              # A release: pin the version and move `latest` onto it.
              VERSION="${{ github.ref_name }}"
              TAGS="$REPO:$VERSION $REPO:latest $REPO:$SHA"
              ;;
            refs/heads/main)
              # The tip of main. Versioned as "<last release>+<sha>" so anything
              # running it reports a version that can't be mistaken for a release.
              VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)+$SHA"
              TAGS="$REPO:main $REPO:$SHA"
              ;;
            *)
              VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)+$SHA"
              TAGS="$REPO:$SHA"
              ;;
          esac
          echo "list=$TAGS" >> "$GITHUB_OUTPUT"
          echo "scan=$REPO:$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          set -euo pipefail
          TAG_ARGS=""
          for t in ${{ steps.tags.outputs.list }}; do TAG_ARGS="$TAG_ARGS -t $t"; done
          docker build $TAG_ARGS --build-arg CT_VERSION="${{ steps.tags.outputs.version }}" .

      - name: Scan with the project's gate (grype + trivy, fixed HIGH/CRITICAL)
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.tags.outputs.scan }}

      - name: Push image
        run: |
          set -euo pipefail
          for t in ${{ steps.tags.outputs.list }}; do docker push "$t"; done

  # The omnibus (deploy/omnibus/): on a release only, assembled from the app image the
  # job above just scanned and pushed — the same bytes, not a rebuild — then smoke-tested
  # and put through the same scan gate before it is pushed. Fossil and the omnibus's own
  # stages come out of the layer cache omnibus.yml keeps warm on main.
  #
  # linux/amd64 only, because the app image it is built from is.
  omnibus:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-omnibus"
          echo "local=$REPO:$SHA" >> "$GITHUB_OUTPUT"
          echo "list=$REPO:${{ github.ref_name }} $REPO:latest $REPO:$SHA" >> "$GITHUB_OUTPUT"

      - name: Build from the released app image
        uses: docker/bake-action@v6
        env:
          CACHE: gha
          APP_IMAGE: ${{ needs.build.outputs.image }}
          # The source clone inside the image is this release, not main.
          OMNIBUS_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
          OMNIBUS_GIT_REF: ${{ github.ref_name }}
          OMNIBUS_TAG: ${{ steps.tags.outputs.local }}
        with:
          source: .
          files: deploy/omnibus/docker-bake.hcl
          targets: omnibus
          load: true

      - name: Smoke test
        run: bun run scripts/smoke-omnibus.ts "${{ steps.tags.outputs.local }}"

      - name: Scan with the project's gate (grype + trivy, fixed HIGH/CRITICAL)
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.tags.outputs.local }}

      - name: Push image
        run: |
          set -euo pipefail
          for t in ${{ steps.tags.outputs.list }}; do
            docker tag "${{ steps.tags.outputs.local }}" "$t"
            docker push "$t"
          done

  # The Helm chart (deploy/helm/claude-transcripts), on a release only: packaged and pushed
  # to GHCR as an OCI artefact once the app image it points at exists. Its version and
  # appVersion are the release's (release.ts stamps them). Install with:
  #   helm install claude-transcripts oci://ghcr.io/<owner>/charts/claude-transcripts --version X.Y.Z
  chart:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      - name: Check the chart is this release's
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got="$(helm show chart deploy/helm/claude-transcripts | sed -n 's/^version: //p')"
          if [ "$got" != "$want" ]; then
            echo "::error::chart is $got, the tag is $want — run scripts/release.ts $want before tagging"
            exit 1
          fi

      - name: Package and push
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm package deploy/helm/claude-transcripts -d out
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push out/claude-transcripts-*.tgz "oci://ghcr.io/$OWNER/charts"
