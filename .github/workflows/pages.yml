name: pages
# Build and deploy the public project website to GitHub Pages: the static landing
# page in `site/` plus the technical docs rendered from `docs/*.md` into `/docs`.
# Uses the built-in GITHUB_TOKEN.
on:
  push:
    branches: [main]
    # Every input the deployed site is built from — keep in sync with the assemble
    # step below (site/ is copied verbatim; docs/ + brand/ feed the
    # docs renderer). A change outside these paths does not affect the output.
    paths:
      - "site/**"
      - "docs/**"
      - "brand/**" # build-docs.ts takes the docs header mark + favicons from brand/
      - "scripts/build-docs.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Assemble site (landing + rendered docs)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r site/. _site/
          # Render docs/*.md straight into the published /docs (dependency-free; no install).
          bun run scripts/build-docs.ts --out _site/docs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
