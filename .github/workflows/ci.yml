name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The contract check compares this branch's spec against the base branch's,
          # which it reads out of git. The default shallow checkout has no such ref,
          # and the check would skip itself into permanent uselessness.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Every committed generated artifact must be reproducible from its source.
      #
      # This exists because it wasn't. `packages/webui/src/api/generated.ts` spent
      # weeks as a *hand-written* file — orval's output was unusable (the spec inlined
      # its schemas, so every type came out named `ListSessions200SessionsItemStatus`),
      # so it was written by hand and kept the name. It even carried a header saying
      # so, while the docs went on claiming clients are generated
      # ([ADR 0019](../../docs/design/decisions/0019-openapi-source-of-truth-generated-clients.md)).
      # `deploy/docker-compose.yml` had the same drift from the other direction: a
      # regeneration silently dropped hand-written comments the generator can't emit.
      #
      # A file named "generated" that nobody regenerates is worse than a hand-written
      # one, because the name suppresses exactly the scrutiny it needs. Regenerating
      # everything and failing on a diff is what makes the claim checkable.
      #
      # `gen:clients` is deliberately separate from `gen:all` in package.json, so both
      # run. `compatibility.json` stamps `generatedAt` but is gitignored, so it can't
      # trip this.
      - run: bun run gen:clients
      - run: bun run gen:all
      - name: generated files are reproducible
        run: git diff --exit-code

      # Does this change break a consumer generated against the base branch's spec?
      # Additive changes pass; a break passes only if a commit declares it. Consumers
      # are generated, so a break surfaces at *their* next codegen, not here.
      - name: contract stays compatible
        run: bun run check:contract
        env:
          CONTRACT_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      # The docs site is built into the app image, and it FAILS on a broken internal
      # link. Without this the first sign of one is the release image refusing to
      # build — which is exactly how v0.0.2's image came not to publish.
      - run: bun run build:docs
      - run: bun run test

  # The Bun version `package.json` claims to support, actually tried.
  #
  # `check` runs on `latest`, which is why a declaration can rot unnoticed: the
  # compression middleware added in v0.0.16 needs `CompressionStream`, which Bun did
  # not provide until 1.3.3, while `engines.bun` still said `>=1.1.0`. Anyone honouring
  # the declared floor got a 500 on every compressible response and a stack trace
  # naming hono rather than their own runtime — and no job here could have seen it.
  #
  # The version is read OUT of `package.json` rather than written here, because a
  # floor pinned in two places is the same bug one level up.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: floor
        name: read the declared Bun floor
        run: |
          version="$(jq -r '.engines.bun' package.json | sed 's/^[^0-9]*//')"
          echo "declared: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.floor.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The webui browser suite. A separate job because it needs a browser download that
  # the rest of the checks don't, and because a layout regression should read as
  # "browser tests failed", not as a mystery inside `check`.
  #
  # No backing services: every `/api` call is answered from the fixtures in
  # `tests/browser/fixtures/`, so this needs nothing but a Chromium.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:browser:install
      - run: bun run test:browser
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          # Traces and failure screenshots — the only way to see what a layout looked
          # like on a machine you can't open a browser on.
          path: tests/browser/.results/
          retention-days: 7
